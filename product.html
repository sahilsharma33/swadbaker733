<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Product — Swad Bakers</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #d97706;
            --primary-dark: #b45309;
            --secondary: #92400e;
            --accent: #f59e0b;
            --cream: #fffaf0;
            --cream-dark: #fef3c7;
            --white: #ffffff;
            --brown: #4a2c1a;
            --brown-light: #6b4428;
            --text: #3f2a1d;
            --muted: #8b735f;
            --border: #ead8c5;
            --shadow-sm: 0 4px 12px rgba(74,44,26,.08);
            --shadow: 0 12px 35px rgba(74,44,26,.13);
            --shadow-lg: 0 20px 55px rgba(74,44,26,.18);
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(245,158,11,.12), transparent 35%),
                radial-gradient(circle at bottom right, rgba(217,119,6,.10), transparent 35%),
                linear-gradient(135deg,#fffaf0,#fff7e6,#fffaf0);
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: rgba(245,158,11,.08);
            top: -100px;
            left: -100px;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: rgba(146,64,14,.06);
            bottom: -150px;
            right: -120px;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
        }

        .site-header {
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,.96);
            border: 1px solid var(--border);
            border-radius: 15px;
            box-shadow: var(--shadow-sm);
            position: relative;
            z-index: 100;
        }

        .brand {
            color: var(--brown);
            text-decoration: none;
            font-size: 27px;
            font-weight: 900;
            transition: .3s ease;
        }

        .brand:hover {
            color: var(--primary);
        }

        .site-header nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .site-header nav a {
            padding: 10px 17px;
            color: var(--brown-light);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            border-radius: 9px;
            transition: .3s ease;
        }

        .site-header nav a:hover {
            color: var(--primary-dark);
            background: var(--cream-dark);
            transform: translateY(-2px);
        }

        .product-page {
            margin: 35px auto;
            min-height: 500px;
        }

        .product-page .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 45px;
            align-items: center;
            padding: 30px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: var(--shadow);
            animation: productAppear .6s ease;
        }

        .product-image,
        .image-container {
            width: 100%;
            min-height: 430px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background:
                radial-gradient(circle,#fffdf8 0%,#fff7e8 70%,#fef0d4 100%);
            border-radius: 18px;
            border: 1px solid #f0ddc4;
            overflow: hidden;
        }

        .product-image img,
        .image-container img {
            max-width: 100%;
            max-height: 400px;
            width: 100%;
            object-fit: contain;
            border-radius: 15px;
            filter: drop-shadow(0 15px 20px rgba(74,44,26,.14));
            transition: .5s ease;
        }

        .product-image img:hover,
        .image-container img:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 20px 28px rgba(74,44,26,.20));
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 17px;
        }

        .product-info h1,
        .product-page h1 {
            color: var(--brown);
            font-size: 34px;
            line-height: 1.2;
            font-weight: 850;
        }

        .product-info h2 {
            color: var(--brown);
            font-size: 25px;
            font-weight: 800;
        }

        .product-category,
        .category {
            width: fit-content;
            padding: 7px 13px;
            color: var(--primary-dark);
            background: #fff4dc;
            border: 1px solid #f2d29e;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .6px;
        }

        .product-description,
        .description {
            color: #6f5a48;
            font-size: 15px;
            line-height: 1.8;
            max-width: 570px;
        }

        .product-price,
        .price {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin: 5px 0;
        }

        .product-price .current-price,
        .price .current-price {
            color: var(--primary-dark);
            font-size: 31px;
            font-weight: 900;
        }

        .product-price .old-price,
        .price .old-price {
            color: #a9998a;
            font-size: 17px;
            text-decoration: line-through;
        }

        .discount,
        .discount-badge {
            width: fit-content;
            padding: 6px 11px;
            color: #fff;
            background: linear-gradient(135deg,#dc2626,#b91c1c);
            border-radius: 7px;
            font-size: 12px;
            font-weight: 800;
        }

        .product-rating,
        .rating {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8a6a27;
            font-size: 14px;
            font-weight: 700;
        }

        .product-rating .stars,
        .rating .stars {
            color: #f59e0b;
            font-size: 18px;
            letter-spacing: 2px;
        }

        .quantity-wrapper,
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .quantity-wrapper label,
        .quantity-control label {
            color: var(--brown);
            font-size: 14px;
            font-weight: 700;
        }

        .quantity-wrapper input,
        .quantity-control input {
            width: 80px;
            height: 43px;
            padding: 0 10px;
            text-align: center;
            color: var(--brown);
            background: #fffaf2;
            border: 1px solid var(--border);
            border-radius: 9px;
            font-weight: 700;
            outline: none;
        }

        .quantity-wrapper input:focus,
        .quantity-control input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(217,119,6,.1);
        }

        .product-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .product-actions button,
        .add-to-cart,
        .buy-now {
            min-height: 51px;
            padding: 0 25px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: .3s ease;
        }

        .add-to-cart {
            color: #fff;
            background: linear-gradient(135deg,var(--primary),var(--primary-dark));
            border: none;
            box-shadow: 0 7px 18px rgba(217,119,6,.25);
        }

        .add-to-cart:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(217,119,6,.32);
        }

        .buy-now {
            color: var(--secondary);
            background: #fff7e8;
            border: 1px solid #e7c89d;
        }

        .buy-now:hover {
            color: #fff;
            background: var(--secondary);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(146,64,14,.2);
        }

        .back-btn,
        .back-to-products {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            width: fit-content;
            margin-bottom: 20px;
            padding: 10px 15px;
            color: var(--brown-light);
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 9px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: .3s ease;
        }

        .back-btn:hover,
        .back-to-products:hover {
            color: var(--primary-dark);
            background: var(--cream-dark);
            border-color: #e4c493;
            transform: translateX(-3px);
        }

        .product-features {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 12px;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid var(--border);
        }

        .product-feature {
            padding: 15px 10px;
            text-align: center;
            background: #fffaf3;
            border: 1px solid #f0dfca;
            border-radius: 12px;
            transition: .3s ease;
        }

        .product-feature:hover {
            transform: translateY(-3px);
            background: #fff5e2;
            box-shadow: var(--shadow-sm);
        }

        .product-feature .icon {
            display: block;
            margin-bottom: 6px;
            font-size: 24px;
        }

        .product-feature strong {
            display: block;
            color: var(--brown);
            font-size: 12px;
        }

        .product-feature span {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 11px;
        }

        .related-products {
            margin-top: 45px;
        }

        .related-products h2 {
            color: var(--brown);
            margin-bottom: 20px;
            font-size: 25px;
            font-weight: 850;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 18px;
        }

        .related-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: .3s ease;
        }

        .related-card:hover {
            transform: translateY(-7px);
            box-shadow: var(--shadow);
        }

        .related-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background: #fff8ec;
        }

        .related-card-content {
            padding: 15px;
        }

        .related-card h3 {
            color: var(--brown);
            font-size: 15px;
            margin-bottom: 7px;
        }

        .related-card .price {
            color: var(--primary-dark);
            font-size: 17px;
            font-weight: 800;
        }

        .product-loading {
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            text-align: center;
        }

        .product-loading::before {
            content: "";
            width: 42px;
            height: 42px;
            margin-bottom: 15px;
            border: 4px solid #f4dfc3;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        .product-empty {
            padding: 70px 25px;
            text-align: center;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
        }

        .product-empty h2 {
            color: var(--brown);
            margin-bottom: 10px;
        }

        .product-empty p {
            color: var(--muted);
            line-height: 1.6;
        }

        .product-page svg,
        .site-header svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.2;
            vertical-align: middle;
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible {
            outline: 3px solid rgba(245,158,11,.3);
            outline-offset: 3px;
        }

        ::selection {
            background: rgba(217,119,6,.25);
            color: var(--brown);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--cream);
        }

        ::-webkit-scrollbar-thumb {
            background: #d6b58e;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        @keyframes productAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 900px) {
            .product-page .product-detail {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .product-image,
            .image-container {
                min-height: 350px;
            }

            .product-page h1,
            .product-info h1 {
                font-size: 30px;
            }

            .related-grid {
                grid-template-columns: repeat(2,1fr);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .site-header {
                padding: 14px 16px;
                border-radius: 12px;
            }

            .brand {
                font-size: 21px;
            }

            .site-header nav {
                gap: 3px;
            }

            .site-header nav a {
                padding: 8px 10px;
                font-size: 12px;
            }

            .product-page {
                margin-top: 22px;
            }

            .product-page .product-detail {
                padding: 17px;
                border-radius: 16px;
            }

            .product-image,
            .image-container {
                min-height: 280px;
                padding: 15px;
            }

            .product-image img,
            .image-container img {
                max-height: 270px;
            }

            .product-page h1,
            .product-info h1 {
                font-size: 26px;
            }

            .product-price .current-price,
            .price .current-price {
                font-size: 27px;
            }

            .product-actions {
                flex-direction: column;
                width: 100%;
            }

            .product-actions button,
            .add-to-cart,
            .buy-now {
                width: 100%;
            }

            .product-features {
                grid-template-columns: 1fr;
            }

            .related-grid {
                grid-template-columns: 1fr;
            }

            .related-card img {
                height: 220px;
            }
        }

        @media (max-width: 380px) {
            .site-header {
                flex-direction: column;
                gap: 12px;
            }

            .site-header nav {
                width: 100%;
                justify-content: center;
            }

            .product-page h1,
            .product-info h1 {
                font-size: 23px;
            }

            .product-description,
            .description {
                font-size: 14px;
            }

            .product-image,
            .image-container {
                min-height: 240px;
            }
        }
    </style>

    <script
        type="module"
        src="https://unpkg.com/lucide@0.263.0/dist/lucide.min.js">
    </script>
</head>

<body>

    <header class="site-header container">
        <a href="/" class="brand">Swad Bakers</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <main class="container product-page" id="product-page">
    </main>

    <script type="module" src="js/app.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) {
                lucide.replace();
            }
        });
    </script>

</body>
</html>
