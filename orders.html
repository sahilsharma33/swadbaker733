<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Your Orders — Swad Bakers</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #d97706;
            --primary-dark: #b45309;
            --secondary: #92400e;
            --accent: #f59e0b;
            --cream: #fffaf0;
            --cream-dark: #fef3c7;
            --white: #ffffff;
            --brown: #4a2c1a;
            --brown-light: #6b4428;
            --text: #3f2a1d;
            --muted: #8b735f;
            --border: #ead8c5;
            --success: #15803d;
            --danger: #dc2626;
            --shadow-sm: 0 4px 12px rgba(74,44,26,.08);
            --shadow: 0 12px 35px rgba(74,44,26,.13);
            --shadow-lg: 0 20px 55px rgba(74,44,26,.18);
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(245,158,11,.12), transparent 35%),
                radial-gradient(circle at bottom right, rgba(217,119,6,.10), transparent 35%),
                linear-gradient(135deg,#fffaf0,#fff7e6,#fffaf0);
            padding: 20px;
        }

        body::before {
            content: "";
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: rgba(245,158,11,.08);
            top: -100px;
            left: -100px;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: rgba(146,64,14,.06);
            bottom: -150px;
            right: -120px;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
        }

        .site-header {
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,.96);
            border: 1px solid var(--border);
            border-radius: 15px;
            box-shadow: var(--shadow-sm);
            position: relative;
            z-index: 10;
        }

        .brand {
            color: var(--brown);
            text-decoration: none;
            font-size: 27px;
            font-weight: 900;
            transition: .3s ease;
        }

        .brand:hover {
            color: var(--primary);
        }

        .site-header nav {
            display: flex;
            align-items: center;
        }

        .site-header nav a {
            padding: 10px 18px;
            color: var(--brown-light);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            border-radius: 9px;
            transition: .3s ease;
        }

        .site-header nav a:hover {
            color: var(--primary-dark);
            background: var(--cream-dark);
            transform: translateY(-2px);
        }

        main.container {
            margin-top: 40px;
            margin-bottom: 50px;
        }

        main h2 {
            color: var(--brown);
            font-size: 32px;
            font-weight: 850;
            margin-bottom: 25px;
            position: relative;
            padding-left: 16px;
        }

        main h2::before {
            content: "";
            position: absolute;
            left: 0;
            top: 4px;
            width: 5px;
            height: 32px;
            border-radius: 10px;
            background: linear-gradient(
                to bottom,
                var(--accent),
                var(--primary-dark)
            );
        }

        #orders-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #orders-list > div {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
            transition: .3s ease;
            animation: orderAppear .5s ease;
        }

        #orders-list > div:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }

        #orders-list h3 {
            color: var(--brown);
            font-size: 20px;
            margin-bottom: 12px;
        }

        #orders-list p {
            color: var(--brown-light);
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 6px;
        }

        #orders-list strong {
            color: var(--primary-dark);
            font-weight: 800;
        }

        #orders-list button {
            min-height: 42px;
            padding: 0 18px;
            margin-top: 12px;
            border: none;
            border-radius: 9px;
            color: var(--white);
            background: linear-gradient(
                135deg,
                var(--primary),
                var(--primary-dark)
            );
            font-family: inherit;
            font-size: 13px;
            font-weight: 750;
            cursor: pointer;
            box-shadow: 0 5px 14px rgba(217,119,6,.2);
            transition: .3s ease;
        }

        #orders-list button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(217,119,6,.3);
        }

        #orders-list button:active {
            transform: translateY(0);
        }

        #orders-list img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fff8ec;
        }

        #orders-list ul {
            list-style: none;
            margin: 15px 0;
            padding: 0;
        }

        #orders-list li {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid #f1e4d4;
        }

        #orders-list li:last-child {
            border-bottom: none;
        }

        .order-status {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            padding: 6px 12px;
            border-radius: 20px;
            background: #dcfce7;
            color: var(--success);
            font-size: 12px;
            font-weight: 800;
        }

        .order-status.pending {
            background: #fef3c7;
            color: #a16207;
        }

        .order-status.cancelled {
            background: #fee2e2;
            color: var(--danger);
        }

        .order-total {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-total span:first-child {
            color: var(--brown-light);
            font-size: 14px;
            font-weight: 700;
        }

        .order-total span:last-child {
            color: var(--primary-dark);
            font-size: 22px;
            font-weight: 900;
        }

        #orders-list:empty::before {
            content: "🧁";
            display: block;
            text-align: center;
            font-size: 50px;
            margin-bottom: 12px;
        }

        #orders-list:empty::after {
            content: "No orders found yet. Start shopping at Swad Bakers!";
            display: block;
            padding: 45px 20px;
            text-align: center;
            color: var(--muted);
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow-sm);
            font-size: 15px;
        }

        ::selection {
            background: rgba(217,119,6,.25);
            color: var(--brown);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--cream);
        }

        ::-webkit-scrollbar-thumb {
            background: #d6b58e;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        a:focus-visible,
        button:focus-visible {
            outline: 3px solid rgba(245,158,11,.3);
            outline-offset: 3px;
        }

        @keyframes orderAppear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 12px;
            }

            .site-header {
                padding: 14px 16px;
                border-radius: 12px;
            }

            .brand {
                font-size: 21px;
            }

            .site-header nav a {
                padding: 8px 12px;
                font-size: 12px;
            }

            main.container {
                margin-top: 25px;
            }

            main h2 {
                font-size: 26px;
            }

            main h2::before {
                height: 27px;
            }

            #orders-list > div {
                padding: 18px;
                border-radius: 15px;
            }

            #orders-list li {
                align-items: flex-start;
            }

            #orders-list img {
                width: 60px;
                height: 60px;
            }

            .order-total {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
        }

        @media (max-width: 400px) {
            .site-header {
                flex-direction: column;
                gap: 10px;
            }

            .site-header nav {
                width: 100%;
                justify-content: center;
            }

            main h2 {
                font-size: 23px;
            }

            #orders-list > div {
                padding: 15px;
            }

            #orders-list p {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <header class="site-header container">
        <a href="/" class="brand">Swad Bakers</a>

        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main class="container">
        <h2>Your Orders</h2>

        <div id="orders-list"></div>
    </main>

    <script type="module" src="js/app.js"></script>

</body>
</html>
