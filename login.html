<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Swad Bakers</title>
  <!--<link rel="stylesheet" href="styles.css">-->
  <style>
    /* =========================================
   SWAD BAKERS - LOGIN / REGISTER STYLES
   ========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary: #d97706;
    --primary-dark: #b45309;
    --secondary: #92400e;
    --accent: #f59e0b;

    --cream: #fffaf0;
    --cream-dark: #fef3c7;
    --white: #ffffff;

    --brown: #4a2c1a;
    --brown-light: #6b4428;
    --text: #3f2a1d;
    --muted: #8b735f;

    --border: #ead8c5;

    --success: #16a34a;
    --danger: #dc2626;

    --shadow-sm: 0 4px 12px rgba(74, 44, 26, 0.08);
    --shadow: 0 12px 35px rgba(74, 44, 26, 0.13);
    --shadow-lg: 0 20px 55px rgba(74, 44, 26, 0.18);

    --radius: 16px;
    --transition: 0.3s ease;
}

/* =========================================
   BODY
   ========================================= */

body {
    min-height: 100vh;
    font-family:
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at top left,
            rgba(245, 158, 11, 0.12),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(217, 119, 6, 0.10),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #fffaf0 0%,
            #fff7e6 45%,
            #fffaf0 100%
        );

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 18px;

    overflow-x: hidden;
}

/* =========================================
   BACKGROUND DECORATION
   ========================================= */

body::before {
    content: "";
    position: fixed;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    background: rgba(245, 158, 11, 0.10);

    top: -100px;
    left: -100px;

    z-index: -1;
}

body::after {
    content: "";
    position: fixed;

    width: 350px;
    height: 350px;

    border-radius: 50%;

    background: rgba(146, 64, 14, 0.06);

    bottom: -150px;
    right: -120px;

    z-index: -1;
}

/* =========================================
   MAIN CONTAINER
   ========================================= */

.container {
    width: 100%;
    max-width: 460px;
    margin: auto;
}

/* =========================================
   AUTH PAGE CARD
   ========================================= */

.auth-page {
    position: relative;

    background: rgba(255, 255, 255, 0.96);

    padding: 42px 38px;

    border-radius: 22px;

    border: 1px solid rgba(234, 216, 197, 0.9);

    box-shadow: var(--shadow-lg);

    backdrop-filter: blur(12px);

    animation: cardAppear 0.7s ease forwards;
}

/* Bakery top decoration */

.auth-page::before {
    content: "🍰";

    position: absolute;

    width: 58px;
    height: 58px;

    top: -29px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--white);

    border: 2px solid var(--accent);

    border-radius: 50%;

    font-size: 27px;

    box-shadow: var(--shadow);
}

/* =========================================
   HEADING
   ========================================= */

.auth-page h2 {
    text-align: center;

    color: var(--brown);

    font-size: 30px;

    font-weight: 800;

    margin-bottom: 8px;

    letter-spacing: -0.5px;
}

.auth-page h2::after {
    content: "Fresh taste • Sweet moments";

    display: block;

    margin-top: 8px;

    color: var(--muted);

    font-size: 13px;

    font-weight: 500;

    letter-spacing: 0.3px;
}

/* =========================================
   FORM
   ========================================= */

#auth-form {
    margin-top: 30px;
}

/* =========================================
   LABEL
   ========================================= */

#auth-form label {
    display: block;

    color: var(--brown);

    font-size: 14px;

    font-weight: 700;

    margin-bottom: 20px;
}

/* =========================================
   INPUT
   ========================================= */

#auth-form input {
    display: block;

    width: 100%;

    height: 52px;

    margin-top: 8px;

    padding: 0 16px;

    border: 1.5px solid var(--border);

    border-radius: 11px;

    background: #fffdf9;

    color: var(--text);

    font-size: 15px;

    outline: none;

    transition:
        border-color var(--transition),
        box-shadow var(--transition),
        background var(--transition),
        transform var(--transition);
}

#auth-form input::placeholder {
    color: #b5a494;
}

#auth-form input:hover {
    border-color: #d6b997;
}

#auth-form input:focus {
    border-color: var(--primary);

    background: var(--white);

    box-shadow:
        0 0 0 4px rgba(217, 119, 6, 0.12),
        0 5px 15px rgba(74, 44, 26, 0.06);

    transform: translateY(-1px);
}

/* =========================================
   AUTH BUTTON AREA
   ========================================= */

.auth-actions {
    display: flex;

    gap: 12px;

    margin-top: 26px;
}

/* =========================================
   COMMON BUTTON
   ========================================= */

.btn {
    min-height: 50px;

    padding: 0 22px;

    border-radius: 11px;

    font-family: inherit;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform var(--transition),
        box-shadow var(--transition),
        background var(--transition),
        border-color var(--transition);

    display: inline-flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    white-space: nowrap;
}

/* =========================================
   PRIMARY BUTTON
   ========================================= */

.btn.primary {
    flex: 1;

    color: var(--white);

    border: 1px solid var(--primary);

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-dark)
        );

    box-shadow:
        0 7px 18px rgba(217, 119, 6, 0.25);
}

.btn.primary:hover {
    background:
        linear-gradient(
            135deg,
            #e88a0a,
            #a94708
        );

    transform: translateY(-2px);

    box-shadow:
        0 10px 24px rgba(217, 119, 6, 0.32);
}

.btn.primary:active {
    transform: translateY(0);

    box-shadow:
        0 4px 10px rgba(217, 119, 6, 0.20);
}

/* =========================================
   OUTLINE BUTTON
   ========================================= */

.btn.outline {
    flex: 1;

    color: var(--secondary);

    background: #fffaf3;

    border: 1.5px solid #d9b992;
}

.btn.outline:hover {
    color: var(--white);

    background: var(--secondary);

    border-color: var(--secondary);

    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(146, 64, 14, 0.20);
}

.btn.outline:active {
    transform: translateY(0);
}

/* =========================================
   MUTED MESSAGE
   ========================================= */

.muted {
    min-height: 22px;

    margin-top: 18px;

    text-align: center;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.5;

    transition: all 0.3s ease;
}

/* =========================================
   SUCCESS / ERROR MESSAGE SUPPORT
   ========================================= */

.muted.success {
    color: var(--success);

    font-weight: 600;
}

.muted.error {
    color: var(--danger);

    font-weight: 600;
}

/* =========================================
   INPUT VALIDATION
   ========================================= */

#auth-form input:valid:not(:placeholder-shown) {
    border-color: #d9c5ae;
}

#auth-form input:invalid:not(:placeholder-shown) {
    border-color: #e7a7a7;
}

/* =========================================
   BUTTON FOCUS
   ========================================= */

.btn:focus-visible {
    outline: 3px solid rgba(245, 158, 11, 0.35);

    outline-offset: 3px;
}

/* =========================================
   LOADING EFFECT
   ========================================= */

.btn.loading {
    pointer-events: none;

    opacity: 0.75;
}

.btn.loading::after {
    content: "";

    width: 15px;
    height: 15px;

    margin-left: 9px;

    border: 2px solid rgba(255, 255, 255, 0.45);

    border-top-color: white;

    border-radius: 50%;

    animation: spin 0.7s linear infinite;
}

/* =========================================
   ANIMATIONS
   ========================================= */

@keyframes cardAppear {
    from {
        opacity: 0;

        transform:
            translateY(25px)
            scale(0.97);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================
   RESPONSIVE - TABLET
   ========================================= */

@media (max-width: 600px) {

    body {
        padding: 25px 16px;
    }

    .auth-page {
        padding: 38px 28px;
    }

    .auth-page h2 {
        font-size: 27px;
    }

}

/* =========================================
   RESPONSIVE - MOBILE
   ========================================= */

@media (max-width: 450px) {

    body {
        padding: 20px 12px;
    }

    .auth-page {
        padding: 38px 20px 28px;

        border-radius: 18px;
    }

    .auth-page h2 {
        font-size: 25px;
    }

    #auth-form {
        margin-top: 25px;
    }

    .auth-actions {
        flex-direction: column;

        gap: 10px;
    }

    .btn {
        width: 100%;
    }

}

/* =========================================
   VERY SMALL DEVICES
   ========================================= */

@media (max-width: 320px) {

    .auth-page {
        padding-left: 16px;
        padding-right: 16px;
    }

    .auth-page h2 {
        font-size: 22px;
    }

    #auth-form input {
        height: 48px;

        font-size: 14px;
    }

    .btn {
        min-height: 47px;

        font-size: 13px;
    }

}

/* =========================================
   DARKER TEXT SELECTION
   ========================================= */

::selection {
    background: rgba(217, 119, 6, 0.25);

    color: var(--brown);
}

/* =========================================
   SCROLLBAR
   ========================================= */

::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: var(--cream);
}

::-webkit-scrollbar-thumb {
    background: #d6b58e;

    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: var(--primary);
}
  </style>
</head>
<body>
  <main class="container auth-page">
    <h2>Login / Register</h2>
    <form id="auth-form">
      <label>Email <input id="email" type="email" required></label>
      <label>Password <input id="password" type="password" required></label>
      <div class="auth-actions">
        <button class="btn primary" id="btn-login">Login</button>
        <button type="button" class="btn outline" id="btn-toggle">Create account</button>
      </div>
      <div id="auth-msg" class="muted"></div>
    </form>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
